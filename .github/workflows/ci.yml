name: Dermatopath Melanoma Engine CI/CD & Security Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[server,test]" build

    - name: Verify install and package build
      run: |
        python -m pip check
        python -m compileall -q agents dermatopath_melanoma_agent cli.py derm_melanoma.py enrichment.py
        python -m build

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Signed audit-chain smoke check
      run: |
        python - <<'PY'
        from agents.base import AuditTrail, PHIGuard, SecurityException
        trail = AuditTrail(secret_key="ci-signature-test-key")
        trail.log("CI", "test", "EVENT", {"sample": "synthetic"})
        assert trail.verify_integrity()
        trail.logs[0]["current_hash"] = "0" * 64
        assert not trail.verify_integrity()
        try:
            PHIGuard.assert_no_phi("MRN-994827")
        except SecurityException:
            pass
        else:
            raise AssertionError("Known identifier was not blocked")
        PY
